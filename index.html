/* RADMIR (Radmir Muftakhin). Editorial rhythm: dark and light sections alternate. The Silk Road map lives only in its own section. */
:root{--mid:#172631;--slate:#354E5D;--ivory:#F4F0E8;--paper:#FAF8F4;--char:#252A2D;--sand:#C7AD85;--stone:#E2DBCE;

*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:70px}
body{margin:0;background:#0f171c;color:var(--paper);font:400 1rem/1.7 var(--sans);-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:inherit}img,video{display:block;max-width:100%}
:focus-visible{outline:2px solid var(--slate);outline-offset:3px}
.skip{position:absolute;left:-999px;top:0;background:var(--char);color:var(--paper);padding:.6rem 1rem;z-index:99}.skip:focus{left:0}
h1,h2,h3{font-family:var(--serif);font-weight:400;line-height:.98;margin:0 0 1.2rem;letter-spacing:-.01em;text-wrap:balance}
h1{font-size:clamp(3rem,8vw,6.4rem)}h2{font-size:clamp(2.2rem,5vw,3.9rem)}h3{font-size:1.65rem;line-height:1.15}

p{margin:0 0 1.15rem;color:var(--mut,#4b5359);max-width:62ch}

/* section themes */
.sec{padding:clamp(4rem,9vw,8rem) clamp(1.25rem,5vw,4rem);background:var(--bg);color:var(--fg)}
.lt,.of,.st,.sd,.dk,.ch,.sl,header.nav,footer{--fg:var(--paper);--mut:#c3ccd1;--acc:var(--sand);--rule:rgba(255,255,255,.22);--sb:var(--sand);--sf:#172631;--sh:var(--paper)}

.dk{--bg:rgba(6,10,13,.76)}.ch{--bg:rgba(6,10,13,.8)}.sl{--bg:rgba(48,72,86,.64);--mut:#d0d8dc;--acc:#E4CD9F}

/* silk road: fixed night map behind the page, the caravan follows the scroll */

#world{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none;background:radial-gradient(120% 90% at 55% 40%,#243540 0%,#16222a 58%,#0f171c 100%)}

.js [data-split] .w>span{transform:translateY(112%);transition:transform 1.05s cubic-bezier(.2,.7,.2,1) calc(var(--i)*65ms)}
.js [data-split].on .w>span{transform:none}
.js .rv{opacity:0;transform:translateY(16px);transition:opacity .9s ease,transform .9s cubic-bezier(.2,.7,.2,1)}
.js .rv.on{opacity:1;transform:none}
.js [data-split].rv{opacity:1;transform:none;transition:none}
.js .fig.rv{transform:none;clip-path:inset(0 0 12% 0);transition:opacity .9s,clip-path 1.2s cubic-bezier(.2,.7,.2,1)}

/* player */
.pl{display:grid;grid-template-columns:auto 1fr auto;gap:1rem;align-items:center;padding:1rem 0;border-top:1px solid var(--rule)}
.pb{width:3rem;height:3rem;border-radius:50%;border:1px solid var(--fg);background:none;cursor:pointer;display:grid;place-items:center;color:var(--fg)}
.pb:hover{background:var(--fg);color:var(--bg)}
.pb svg{width:1rem;height:1rem;fill:currentColor}
.wf{display:flex;align-items:center;gap:2px;height:48px;cursor:pointer;min-width:0}
.wf i{flex:1;background:rgba(127,127,127,.4);min-width:1px;border-radius:1px;transition:background .15s}
.wf i.d{background:var(--acc)}
.pl .tt{grid-column:2;font:400 1.3rem var(--serif);margin-top:-.4rem;color:var(--fg)}
.tm{font-size:.82rem;font-variant-numeric:tabular-nums;color:var(--mut)}
/* form */
form{display:grid;gap:1.1rem;max-width:680px}
label{display:grid;gap:.35rem;font-size:.86rem;font-weight:500;color:var(--fg)}
input,select,textarea{font:inherit;color:var(--paper);background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.3);padding:.8rem .9rem;border-radius:0;width:100%;min-width:0}
option{color:#20252A}
input:focus,select:focus,textarea:focus{border-color:var(--sand);outline:2px solid var(--sand);outline-offset:0}
.two{display:grid;gap:1.1rem;grid-template-columns:1fr}@media(min-width:600px){.two{grid-template-columns:1fr 1fr}}
.status{padding:1rem;border-left:3px solid var(--sand);background:rgba(127,127,127,.12);font-size:.92rem;color:var(--fg)}
.sel{user-select:all}
footer{background:rgba(24,28,31,.96);color:#c3ccd1;padding:2.5rem clamp(1.25rem,5vw,4rem);display:flex;flex-wrap:wrap;gap:1rem 2.5rem;justify-content:space-between;align-items:center;font-size:.86rem}
footer a{text-decoration:none;border-bottom:1px solid rgba(255,255,255,.3)}footer a:hover{color:var(--sand);border-color:var(--sand)}
footer .fl{display:flex;gap:.4rem 1.4rem;flex-wrap:wrap}
::selection{background:var(--sand);color:var(--char)}
.dk :focus-visible,.ch :focus-visible,.sl :focus-visible,.sd :focus-visible,header :focus-visible,footer :focus-visible{outline-color:var(--sand)}

/* mobile menu: opens below the header, locks page scroll, Escape or any link closes it, Tab stays inside header and menu */
const MN={btn:$("#mbtn"),panel:$("#mnav"),open:false};
function menuSet(open,focusBtn){if(MN.open===open)return;MN.open=open;
  MN.btn.setAttribute("aria-expanded",open);MN.btn.setAttribute("aria-label",open?"Close menu":"Open menu");
  MN.panel.classList.toggle("open",open);document.documentElement.classList.toggle("menu-open",open);
  ["#main","#foot",".skip"].forEach(q=>{const el=$(q);if(el)el.inert=open});
  if(lenis)open?lenis.stop():lenis.start();
  if(open)setTimeout(()=>{const a=MN.panel.querySelector("a");if(a)a.focus({preventScroll:true})},60);else if(focusBtn)MN.btn.focus()}
MN.btn.addEventListener("click",()=>menuSet(!MN.open));
MN.panel.addEventListener("click",e=>{if(e.target.closest("a"))menuSet(false)});
document.addEventListener("keydown",e=>{if(!MN.open)return;
  if(e.key==="Escape"){e.preventDefault();menuSet(false,true);return}
  if(e.key!=="Tab")return;const f=[...document.querySelectorAll("header.nav .brand,#mbtn,#mnav a")],i=f.indexOf(document.activeElement);
  if(e.shiftKey&&i<=0){e.preventDefault();f[f.length-1].focus()}else if(!e.shiftKey&&i===f.length-1){e.preventDefault();f[0].focus()}});
matchMedia("(min-width:900px)").addEventListener("change",m=>{if(m.matches)menuSet(false)});
